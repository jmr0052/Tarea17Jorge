<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>
</head>
<body>
<h1>Library Management System</h1>

<section id="loan-form">
    <h2>New Loan</h2>
    <input type="text" id="memberId" placeholder="Member ID">
    <input type="text" id="isbn" placeholder="ISBN">
    <button id="submitLoan">Submit Loan</button>
    <p id="loanResult"></p>
</section>

<section id="book-list">
    <h2>Available Books</h2>
    <ul id="books">
        <li class="book-item">La sombra del viento - Carlos Ruiz Zafon</li>
        <li class="book-item">Patria - Fernando Aramburu</li>
        <li class="book-item">La catedral del mar - Ildefonso Falcones</li>
    </ul>
</section>

<section id="member-section">
    <h2>Members</h2>
    <ul id="members">
        <li class="member-item">John Doe - STUDENT</li>
        <li class="member-item">Dr. Jane Smith - TEACHER</li>
        <li class="member-item">Bob Guest - GUEST</li>
    </ul>
</section>
</body>
</html>
